---
- name: Install joe editor based on OS family
  hosts: linux
  become: yes
  tasks:
    - name: Show OS family
      debug:
        msg: "OS family is {{ ansible_os_family }}"

    - name: Install joe on Debian-based systems
      apt:
        name: joe
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install joe on RedHat-based systems
      yum:
        name: joe
        state: present
      when: ansible_os_family == "RedHat"

    - name: Verify joe is installed
      command: joe --version
      register: joe_version
      changed_when: false

    - name: Show joe version
      debug:
        var: joe_version.stdout_lines
